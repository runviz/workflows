name: Fetch Image from Picsum

on:
  workflow_dispatch:
    inputs:
      image_id:
        description: 'ID of the image to fetch (0–1084)'
        required: true
        default: '237'

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch image from Picsum
        run: |
          python - << 'EOF'
          import os
          import requests

          image_id = os.environ.get("IMAGE_ID", "${{ github.event.inputs.image_id }}")
          url = f"https://picsum.photos/id/{image_id}/400/300"

          response = requests.get(url)
          response.raise_for_status()

          filename = f"image_{image_id}.jpg"
          with open(filename, "wb") as f:
              f.write(response.content)

          print(f"Downloaded image saved as {filename}")
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: fetched-image
          path: image_*.jpg